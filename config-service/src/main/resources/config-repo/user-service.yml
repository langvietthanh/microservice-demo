server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/user_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Root@12345
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        # mở endpoint /actuator/prometheus
        include: "health,info,prometheus" 
  metrics:
    tags:
      # gắn nhãn "application" cho mọi metric (dashboard 4701 cần nhãn này)
      application: user-service